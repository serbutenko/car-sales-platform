syntax = "proto3";

package ru.butenko.proto.storage;

service CarService {
  rpc ListAvailableCars(Empty) returns (CarListResponse);
  rpc GetCarById(CarRequest) returns (Car);
}

message Car {
  string id = 1;
  string modelId = 2;
  string vin = 3;
  string status = 4;
}

message CarListResponse {
  repeated Car cars = 1;
}

message CarRequest {
  string id = 1;
}

message Empty {}
