                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: "NUMERIC(19,2)"
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-car-model-required-components
      author: sergey-butenko
      changes:
        - createTable:
            tableName: car_model_required_components
            columns:
              - column:
                  name: car_model_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: component_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: car_model_required_components
            baseColumnNames: car_model_id
            referencedTableName: car_models
            referencedColumnNames: id
            constraintName: fk_required_components_car_model

