databaseChangeLog:
  - changeSet:
      id: 003-create-outbox-events
      author: sergey-butenko
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: event_type
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: timestamp with time zone

              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: text

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_unpublished
            columns:
              - column:
                  name: published_at
              - column:
                  name: created_at
